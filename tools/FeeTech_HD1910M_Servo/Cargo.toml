# =============================================================================
# Cargo.toml: the Rust project's "ID card" and "purchase list"
#
# Cargo is Rust's official build tool + package manager (equivalent to C's Makefile + downloading libraries by hand,
# or Python's pip + venv, but all integrated into one tool).
# This file tells Cargo:
#   1. What our package is called and its version (the [package] section)
#   2. Which third-party libraries to download from the internet (crates.io, Rust's official registry) (the [dependencies] section)
#
# Build commands:
#   cargo build          # debug build (fast compile, slow run, output in target/debug/)
#   cargo build --release# release build (slow compile, fast run, output in target/release/)
#   cargo run -- <args>  # compile and run directly; arguments after -- are passed to our program
# =============================================================================

[package]
name = "feetech-HD1910M-tester" # package name; the generated executable has the same name
version = "0.1.0"
edition = "2021"                # Rust's "language edition"; 2021 is the mainstream edition for teaching today
description = "飞特 HD1910M 串口舵机测试工具（FT-SCS 协议）"

# [Library target] src/lib.rs is compiled into a library named feetech_servo,
# so the GUI project (or any other Rust project) can reuse it via a path dependency.
[lib]
name = "feetech_servo"
path = "src/lib.rs"

[dependencies]
# serialport: cross-platform serial port library. The servos hang off /dev/ttyUSB0 via a USB-to-TTL adapter (CH340),
# and we need it to open the serial port, set the baud rate, and send/receive byte streams.
serialport = "4.7"

# thiserror: lets us define professional error types with a one-line #[error("...")] annotation,
# avoiding lots of handwritten boilerplate. Error handling is a core feature of Rust and worth learning well.
thiserror = "2"

# ==================== The dependencies below are used only by the CLI (main.rs) ====================
# clap and indicatif must be regular dependencies (not [dev-dependencies]) for the CLI to use them;
# the GUI project also pulls them in when depending on this package via [lib] (an acceptable size cost).
# For maximum leanness the CLI could be split into its own package, but this teaching project stays simple.

# clap: command-line argument parsing library. The derive feature lets us declare command-line arguments
# by "annotating a struct", and automatically generates --help, argument validation, etc. Very convenient.
clap = { version = "4.5", features = ["derive"] }

# indicatif: terminal progress bar library (the de facto standard in the Rust ecosystem).
# Used to show a nice progress bar, spinner and ETA while scanning the bus.
indicatif = "0.17"
