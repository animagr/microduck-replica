# Card build config: change these to your own, save, then right-click and run 1-做卡.ps1
WIFI_SSID=改成你的WiFi名
WIFI_PASSWORD=改成你的WiFi密码
# The accounts/passwords below take effect only after logging in as root / 1234 for the first time and completing the Armbian wizard.
USER_NAME=duck
USER_PASSWORD=duck1234
ROOT_PASSWORD=duck1234
# Optional: HTTP proxy the board uses for internet access (needed in mainland China to reach GitHub for installing official software); leave empty if none
HTTP_PROXY=
