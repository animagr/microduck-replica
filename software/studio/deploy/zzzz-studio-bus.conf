# /run/microduck-helper/bus-held present = the main program is blocked by Microduck Studio (servo tuning in progress). To release: hand back in Studio, or reboot.
# Install to /etc/systemd/system/robotd.service.d/zzzz-studio-bus.conf, then systemctl daemon-reload (does not restart robotd).
# Why not systemctl mask --runtime: robotd.service itself lives in /etc/systemd/system, and a mask in /run cannot override it
# (fork packaging/runtime.py uses the same trick to stop updaterd). The flag lives in /run, so it is gone after power loss or reboot, and robotd autostarts at boot as usual.
# While the flag is present, systemctl start robotd returns 0 but the unit stays inactive with ConditionResult=no; do not judge whether it started by the exit code.
[Unit]
ConditionPathExists=!/run/microduck-helper/bus-held

# Only enable the two lines below after the step 3 acceptance check (Studio hands back without relaxing), then daemon-reload again. Once enabled, the fork's robotd
# checks the handover marker at startup; without a marker it behaves exactly like V167. Older robotd versions do not recognize this variable, so enabling it has no effect there.
#[Service]
#Environment=MICRODUCK_HANDOVER_MARKER=/run/microduck-handover/handover.json
