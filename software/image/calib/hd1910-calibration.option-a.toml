# Generic factory calibration (option A): every joint direction is -1, zero position 2048, nothing calibrated per unit yet.
# These values only ensure the main program can read the encoders; after calibrating and checking the IMU orientation in Studio's getting-started checklist,
# use "写进主程序" (Write to main program) to write the real zero positions, directions and limits. Until then the main program only reads and does not apply torque.
motion_enabled = false
imu_mount_verified = false
# [w, x, y, z], rotation from sensor to torso, official +90 degrees about Y; the orientation must be checked after assembly.
imu_mount_quat = [0.7071067811865476, 0.0, 0.7071067811865476, 0.0]

units_verified = false
current_ma_per_count = 0.0

