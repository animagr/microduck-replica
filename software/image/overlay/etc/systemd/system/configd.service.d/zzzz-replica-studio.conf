# Studio 以 radxa 用户运行，要调 net.connect / pad.pair 这些改动类接口。
# configd 只看对方的主组，--allow-group robot 没用（radxa 的主组是 radxa），所以按用户名放行。
# Studio runs as the radxa user and needs to call state-changing interfaces such as net.connect / pad.pair.
# configd only looks at the caller's primary group, so --allow-group robot does not help (radxa's primary group is radxa); allow by user name instead.
[Service]
ExecStart=
ExecStart=/opt/robot/daemon/current/bin/configd --allow-user btd,radxa
