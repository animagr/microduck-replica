# The replica image skips the Python wait script in the base image: if robotd is not up yet, padd exits by itself,
# and systemd retries after 5 seconds; the official padd.service is designed this way (Restart=always + RestartSec=5s).
[Service]
ExecStart=
ExecStart=/opt/robot/feetech-ft5-r5/padd --socket /run/robotd.sock --config /etc/robot/feetech-ft5/robotd.toml --max-head 2.5 --input-settings /etc/robot/feetech-ft5/pad-settings.json
RuntimeDirectory=padd
RestartPreventExitStatus=78
