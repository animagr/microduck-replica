# Microduck replica image: the image ships no SSH host keys; each card generates its own.
# The system's sshd-keygen.service only runs on "first boot" (ConditionFirstBoot), and a machine-id emptied to a blank file
# is not necessarily treated as first boot: the keys are not generated, sshd -t fails and port 22 does not open (exactly what happened on the 10-21 acceptance-check card).
# So generate any missing keys before every start (ssh-keygen -A only fills in missing ones and leaves existing ones alone).
[Service]
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
ExecStartPre=/usr/sbin/sshd -t
